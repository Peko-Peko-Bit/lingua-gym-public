<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 200 200">
  <!-- Background -->
  <rect x="0" y="0" width="200" height="200" rx="44" fill="#1c1c1c" stroke="#444444" stroke-width="2"/>

  <!-- Body -->
  <ellipse cx="100" cy="172" rx="36" ry="28" fill="#fbbf24"/>

  <!-- Left arm with dumbbell -->
  <line x1="72" y1="148" x2="48" y2="164" stroke="#fbbf24" stroke-width="10" stroke-linecap="round"/>
  <rect x="34" y="158" width="8" height="16" rx="3" fill="#ffffff"/>
  <rect x="30" y="161" width="16" height="10" rx="2" fill="#dddddd"/>

  <!-- Right arm with dumbbell -->
  <line x1="128" y1="148" x2="152" y2="164" stroke="#fbbf24" stroke-width="10" stroke-linecap="round"/>
  <rect x="158" y="158" width="8" height="16" rx="3" fill="#ffffff"/>
  <rect x="154" y="161" width="16" height="10" rx="2" fill="#dddddd"/>

  <!-- Head -->
  <circle cx="100" cy="108" r="52" fill="#fcd34d"/>

  <!-- Headband -->
  <path d="M51 90 Q100 74 149 90" fill="none" stroke="#f97316" stroke-width="9" stroke-linecap="round"/>

  <!-- Eyes -->
  <circle cx="84" cy="104" r="6" fill="#1c1c1c"/>
  <circle cx="116" cy="104" r="6" fill="#1c1c1c"/>
  <circle cx="86" cy="102" r="2" fill="white"/>
  <circle cx="118" cy="102" r="2" fill="white"/>

  <!-- Smile -->
  <path d="M84 118 Q100 132 116 118" fill="none" stroke="#1c1c1c" stroke-width="3" stroke-linecap="round"/>

  <!-- Cheeks -->
  <ellipse cx="68" cy="116" rx="10" ry="7" fill="#f87171" opacity="0.45"/>
  <ellipse cx="132" cy="116" rx="10" ry="7" fill="#f87171" opacity="0.45"/>

  <!-- Speech bubble: top right -->
  <rect x="104" y="8" width="82" height="48" rx="11" fill="white"/>
  <polygon points="112,56 126,56 118,68" fill="white"/>

  <!-- A box -->
  <rect x="110" y="14" width="30" height="30" rx="6" fill="#3b82f6"/>
  <text x="125" y="35" font-family="sans-serif" font-size="20" font-weight="700" fill="white" text-anchor="middle">A</text>

  <!-- æ box -->
  <rect x="148" y="14" width="30" height="30" rx="6" fill="#22c55e"/>
  <text x="163" y="35" font-family="serif" font-size="18" font-weight="700" fill="white" text-anchor="middle">æ</text>

  <!-- Arrows between boxes -->
  <path d="M140 21 Q144 17 148 21" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/>
  <path d="M148 33 Q144 37 140 33" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
</svg>
